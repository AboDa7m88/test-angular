<div class="container mt-4">
  <h1 class="mb-4">Student Management System</h1>

  <app-student-form (studentAdded)="onStudentAdded($event)" />

  <div class="d-flex gap-3 align-items-center mb-3 flex-wrap">
    <input
      type="text"
      class="form-control"
      style="max-width: 250px;"
      placeholder="Search by name..."
      [(ngModel)]="searchTerm"
    />
    <button class="btn btn-outline-secondary btn-sm" (click)="toggleSort()">
      Sort by Grade: {{ sortAscending ? 'Low to High' : 'High to Low' }}
    </button>
    <button class="btn btn-outline-secondary btn-sm" (click)="toggleList()">
      {{ showList ? 'Hide List' : 'Show List' }}
    </button>
  </div>

  <p class="text-muted">Passed: {{ passedCount }} | Failed: {{ failedCount }}</p>

  @if (showList) {
    <app-student-list [students]="filteredStudents" (delete)="onDeleteStudent($event)" />
  }
</div>
